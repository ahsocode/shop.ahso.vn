name: CI/CD Next.js to VPS

on:
  push:
    branches:
      - main

jobs:
  check_on_linux:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies (dev + prod)
        run: npm ci

      # ======================
      # Prisma generate
      # ======================
      - name: Prisma generate (nếu dùng Prisma)
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma generate
          else
            echo "No Prisma schema, skip."
          fi

      # ======================
      # Prisma validate
      # ======================
      - name: Prisma validate (optional)
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma validate
          else
            echo "No Prisma schema, skip."
          fi

      # ======================
      # TypeScript
      # ======================
      - name: TypeScript check
        run: |
          if npx tsc -v >/dev/null 2>&1; then
            npx tsc --noEmit
          else
            echo "TS not configured, skip."
          fi

      # ======================
      # Lint
      # ======================
      - name: Lint
        run: |
          if npm run | grep -q "lint"; then
            npm run lint
          else
            echo "No lint script, skip."
          fi

      # ======================
      # Tests
      # ======================
      - name: Test (optional)
        run: |
          if npm run | grep -q "test"; then
            npm test
          else
            echo "No test script, skip."
          fi

      # ======================
      # Build Next.js trên CI (đã có DB Supabase)
      # ======================
      - name: Build Next.js
        env:
          NODE_ENV: production
          SKIP_SITEMAP_DB: "true"
          SKIP_BUILD_DB: "true"
        run: npm run build

      # ======================
      # Chuẩn bị artifact: .next + public + node_modules(prod)
      # ======================
      - name: Archive build artifact
        run: |
          # Giữ artifact nhỏ: không kèm node_modules (cài trên VPS)
          rm -rf node_modules
          tar -czf app-artifact.tar.gz .next public package.json package-lock.json prisma prisma.config.ts next.config.ts

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-app-artifact
          path: app-artifact.tar.gz

  # ======================================================
  # Deploy to VPS when CI passes
  # ======================================================
  deploy:
    runs-on: ubuntu-latest
    needs: check_on_linux
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-app-artifact
          path: .

      - name: Copy build artifact to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "app-artifact.tar.gz"
          target: "/var/www/nextapp"

      - name: SSH & deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /var/www/nextapp
            echo "==> Giải nén artifact mới"
            tar -xzf app-artifact.tar.gz
            echo "==> Cài đặt dependencies (prod)"
            npm ci --omit=dev
            echo "==> Prisma generate"
            npx prisma generate
            echo "==> Restart PM2 process: shop"
            pm2 restart shop
