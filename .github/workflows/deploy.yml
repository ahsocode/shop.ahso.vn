name: CI/CD Next.js to VPS

on:
  push:
    branches:
      - main

jobs:
  check_on_linux:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies (dev + prod)
        run: npm ci

      # ======================
      # Prisma generate
      # ======================
      - name: Prisma generate
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma generate
          else
            echo "No Prisma schema, skip."
          fi

      # ======================
      # Prisma validate
      # ======================
      - name: Prisma validate
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma validate
          else
            echo "No Prisma schema, skip."
          fi

      # ======================
      # TypeScript check
      # ======================
      - name: TypeScript check
        run: |
          if npx tsc -v >/dev/null 2>&1; then
            npx tsc --noEmit
          else
            echo "TS not configured, skip."
          fi

      # ======================
      # Lint
      # ======================
      - name: Lint
        run: |
          if npm run | grep -q "lint"; then
            npm run lint
          else
            echo "No lint script, skip."
          fi

      # ======================
      # Tests (optional)
      # ======================
      - name: Test
        run: |
          if npm run | grep -q "test"; then
            npm test
          else
            echo "No test script, skip."
          fi

      # ======================
      # Build Next.js trên GitHub Actions
      # ======================
      - name: Build Next.js
        env:
          NODE_ENV: production
          SKIP_SITEMAP_DB: "true"
          SKIP_BUILD_DB: "true"
        run: npm run build

      # ======================
      # Tạo artifact NHỎ (chỉ build output + configs)
      # ======================
      - name: Archive build artifact
        run: |
          echo "==> Creating minimal artifact (without node_modules)"
          
          # Xóa node_modules (không cần gửi lên VPS)
          rm -rf node_modules
          
          # Đóng gói CHỈ build output + configs
          tar -czf app-artifact.tar.gz \
            .next \
            public \
            package.json \
            package-lock.json \
            prisma \
            prisma.config.ts \
            next.config.ts \
            tailwind.config.ts \
            tsconfig.json \
            components.json
          
          # Show artifact size
          echo "==> Artifact size:"
          ls -lh app-artifact.tar.gz
          du -h app-artifact.tar.gz

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-app-artifact
          path: app-artifact.tar.gz
          retention-days: 1

  # ======================================================
  # Deploy to VPS when CI passes
  # ======================================================
  deploy:
    runs-on: ubuntu-latest
    needs: check_on_linux
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-app-artifact
          path: .

      - name: Copy build artifact to VPS (rsync)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Copy with rsync (nén, ổn định hơn scp)
          rsync -az --compress-level=9 --progress \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -p 22" \
            app-artifact.tar.gz \
            "${SSH_USER}@${SSH_HOST}:/var/www/nextapp/"

      - name: SSH & deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 10m
          command_timeout: 10m
          script: |
            set -e  # Exit on error
            
            cd /var/www/nextapp
            
            echo "==> Extracting new build artifact"
            tar -xzf app-artifact.tar.gz
            rm app-artifact.tar.gz
            
            echo "==> Checking if dependencies changed"
            
            # Calculate hash of current package.json
            CURRENT_HASH=$(md5sum package.json 2>/dev/null | awk '{print $1}' || echo "none")
            
            # Read saved hash (if exists)
            if [ -f .package.json.hash ]; then
              SAVED_HASH=$(cat .package.json.hash)
            else
              SAVED_HASH="none"
            fi
            
            echo "Current hash: $CURRENT_HASH"
            echo "Saved hash: $SAVED_HASH"
            
            # Compare hashes
            if [ "$CURRENT_HASH" != "$SAVED_HASH" ]; then
              echo "==> 📦 Dependencies CHANGED - Reinstalling..."
              npm ci --omit=dev
              
              echo "==> Generating Prisma client"
              npx prisma generate
              
              echo "==> Saving new hash"
              echo "$CURRENT_HASH" > .package.json.hash
              
              echo "==> ✅ Dependencies updated"
            else
              echo "==> ✅ Dependencies UNCHANGED - Skipping npm ci"
            fi
            
            echo "==> Restarting PM2 process: shop"
            pm2 restart shop --update-env || pm2 start npm --name shop -- start
            
            echo "==> 🎉 Deployment complete!"
            echo ""
            echo "==> PM2 Status:"
            pm2 list
            echo ""
            echo "==> App Info:"
            pm2 info shop
