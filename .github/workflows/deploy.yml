name: CI/CD Next.js to VPS

on:
  push:
    branches:
      - main

jobs:
  check_on_linux:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ======================
      # Prisma generate
      # ======================
      - name: Prisma generate (nếu dùng Prisma)
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma generate
          else
            echo "No Prisma schema, skip."
          fi

      # ======================
      # Prisma validate
      # ======================
      - name: Prisma validate (optional)
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma validate
          else
            echo "No Prisma schema, skip."
          fi

      # ======================
      # TypeScript
      # ======================
      - name: TypeScript check
        run: |
          if npx tsc -v >/dev/null 2>&1; then
            npx tsc --noEmit
          else
            echo "TS not configured, skip."
          fi

      # ======================
      # Lint
      # ======================
      - name: Lint
        run: |
          if npm run | grep -q "lint"; then
            npm run lint
          else
            echo "No lint script, skip."
          fi

      # ======================
      # Tests
      # ======================
      - name: Test (optional)
        run: |
          if npm run | grep -q "test"; then
            npm test
          else
            echo "No test script, skip."
          fi

      # ======================
      # ❗ Bỏ build tại đây (Next.js prerender cần DB)
      # ======================
      - name: Skip build here
        run: echo "Skipping next build on CI. Build will run on VPS."
        # 🔥 THÊM 2 STEP NÀY
      - name: Archive node_modules
        run: |
          tar -czf node_modules.tar.gz node_modules

      - name: Upload node_modules artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-modules
          path: node_modules.tar.gz

  # ======================================================
  # Deploy to VPS when CI passes
  # ======================================================
  deploy:
    runs-on: ubuntu-latest
    needs: check_on_linux
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download node_modules artifact
        uses: actions/download-artifact@v4
        with:
          name: node-modules
          path: .

      - name: Copy node_modules to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "node_modules.tar.gz"
          target: "/var/www/nextapp"

      - name: SSH & deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            bash /var/www/deploy_nextapp.sh
