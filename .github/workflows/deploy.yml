name: CI/CD Next.js to VPS

on:
  push:
    branches:
      - main

jobs:
  # ======================================================
  # CI: Build + Check on GitHub Actions
  # ======================================================
  check_on_linux:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (dev + prod)
        run: npm ci

      # ======================
      # Prisma generate
      # ======================
      - name: Prisma generate
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma generate
          else
            echo "No Prisma schema, skip."
          fi

      # ======================
      # Prisma validate
      # ======================
      - name: Prisma validate
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma validate
          else
            echo "No Prisma schema, skip."
          fi

      # ======================
      # TypeScript check
      # ======================
      - name: TypeScript check
        run: |
          if npx tsc -v >/dev/null 2>&1; then
            npx tsc --noEmit
          else
            echo "TS not configured, skip."
          fi

      # ======================
      # Lint
      # ======================
      - name: Lint
        run: |
          if npm run | grep -q "lint"; then
            npm run lint
          else
            echo "No lint script, skip."
          fi

      # ======================
      # Tests (optional)
      # ======================
      - name: Test
        run: |
          if npm run | grep -q "test"; then
            npm test
          else
            echo "No test script, skip."
          fi

      # ======================
      # Build Next.js (CI only)
      # ======================
      - name: Build Next.js
        env:
          NODE_ENV: production
          SKIP_SITEMAP_DB: "true"
          SKIP_BUILD_DB: "true"
        run: npm run build

      # ======================
      # Create minimal artifact
      # ======================
      - name: Archive build artifact
        run: |
          echo "==> Creating minimal artifact"

          rm -rf node_modules

          tar -czf app-artifact.tar.gz \
            .next \
            public \
            package.json \
            package-lock.json \
            prisma \
            prisma.config.ts \
            next.config.ts \
            tailwind.config.ts \
            tsconfig.json \
            components.json

          ls -lh app-artifact.tar.gz

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-app-artifact
          path: app-artifact.tar.gz
          retention-days: 1

  # ======================================================
  # CD: Deploy to VPS
  # ======================================================
  deploy:
    runs-on: ubuntu-latest
    needs: check_on_linux
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-app-artifact
          path: .

      - name: Copy build artifact to VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          rsync -az --compress-level=9 \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -p 22" \
            app-artifact.tar.gz \
            "${SSH_USER}@${SSH_HOST}:/var/www/shopahsovn/"

      - name: SSH & deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 10m
          command_timeout: 10m
          script: |
            set -e

            cd /var/www/shopahsovn

            echo "==> Extracting artifact"
            rm -rf .next
            tar -xzf app-artifact.tar.gz
            rm app-artifact.tar.gz

            echo "==> Checking dependency changes"

            CURRENT_HASH="$( (md5sum package.json && md5sum package-lock.json) | md5sum | awk '{print $1}' )"
            SAVED_HASH="$(cat .package.json.hash 2>/dev/null || echo none)"

            if [ "$CURRENT_HASH" != "$SAVED_HASH" ]; then
              echo "==> Dependencies changed"
              npm ci --omit=dev
              npx prisma generate
              echo "$CURRENT_HASH" > .package.json.hash
            else
              echo "==> Dependencies unchanged"
            fi

            echo "==> Restarting PM2: shopahsovn"
            pm2 restart shopahsovn --update-env || pm2 start npm --name shopahsovn -- start
            pm2 save

            echo "==> Deployment complete"
            pm2 list
            pm2 info shopahsovn
