name: Build AHSOvn Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Compute image namespace
        id: vars
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "site_url=${NEXT_PUBLIC_SITE_URL:-https://ahso.vn}" >> "$GITHUB_OUTPUT"
          echo "app_url=${NEXT_PUBLIC_APP_URL:-https://ahso.vn}" >> "$GITHUB_OUTPUT"
          echo "ga_measurement_id=${NEXT_PUBLIC_GA_MEASUREMENT_ID:-G-YR90CS685E}" >> "$GITHUB_OUTPUT"
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ steps.vars.outputs.owner_lc }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ steps.vars.outputs.site_url }}
            NEXT_PUBLIC_APP_URL=${{ steps.vars.outputs.app_url }}
            NEXT_PUBLIC_TINYMCE_API_KEY=${{ secrets.NEXT_PUBLIC_TINYMCE_API_KEY }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ steps.vars.outputs.ga_measurement_id }}
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner_lc }}/ahsovn:latest
            ghcr.io/${{ steps.vars.outputs.owner_lc }}/ahsovn:${{ github.sha }}
