name: Build Next.js (standalone) & Publish Release Artifact

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (dev + prod)
        run: npm ci

      - name: Prisma generate (optional)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma generate
          else
            echo "No Prisma schema, skip."
          fi

      - name: Prisma validate (optional)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma validate
          else
            echo "No Prisma schema, skip."
          fi


      - name: TypeScript check (optional)
        run: |
          if npx tsc -v >/dev/null 2>&1; then
            npx tsc --noEmit
          else
            echo "TS not configured, skip."
          fi

      - name: Lint (optional)
        run: |
          if npm run | grep -q "lint"; then
            npm run lint
          else
            echo "No lint script, skip."
          fi

      - name: Test (optional)
        run: |
          if npm run | grep -q "test"; then
            npm test
          else
            echo "No test script, skip."
          fi

      - name: Build Next.js (standalone)
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          SKIP_SITEMAP_DB: "true"
          SKIP_BUILD_DB: "true"
          NEXT_PUBLIC_TINYMCE_API_KEY: ${{ secrets.NEXT_PUBLIC_TINYMCE_API_KEY }}
          # Nếu bạn muốn bỏ TS errors lúc build thì tạo repo variable NEXT_IGNORE_BUILD_ERRORS=1
          NEXT_IGNORE_BUILD_ERRORS: ${{ vars.NEXT_IGNORE_BUILD_ERRORS || '0' }}
        run: npm run build

      - name: Create artifact + checksum (standalone)
        run: |
          set -e
          echo "==> Creating standalone artifact"

          # Verify standalone output exists
          test -f .next/standalone/server.js
          test -d .next/static

          # Standalone đã chứa runtime deps cần thiết => KHÔNG cần rm node_modules
          # Bundle tối thiểu để VPS extract là chạy được
          tar -czf app-artifact.tar.gz \
            .next/standalone \
            .next/static \
            public \
            prisma \
            package.json \
            package-lock.json

          sha256sum app-artifact.tar.gz > app-artifact.sha256
          ls -lh app-artifact.tar.gz app-artifact.sha256

      - name: Publish GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          files: |
            app-artifact.tar.gz
            app-artifact.sha256
